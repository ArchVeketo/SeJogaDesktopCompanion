[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sejoga-desktop-companion"
version = "0.1.0"
description = "Companion 3D interativo do mascote Mário (SeJogaNoArmário) para o desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Se Joga no Armário" }]
keywords = ["desktop-companion", "3d", "panda3d", "mascot", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

# Dependências do núcleo: sem engine, sem Win32 — mantêm o pacote importável
# em qualquer máquina (CI, dev, docs).
dependencies = [
    "packaging>=24.0",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Renderizador 3D. A escolha final está documentada em docs/ARQUITETURA.md;
# ambos os grupos ficam disponíveis para permitir a comparação de protótipos.
# pymunk é o motor de física 2D usado por physics.py (dependência real de runtime).
panda3d = [
    "panda3d>=1.10.15",
    "panda3d-gltf>=1.3",
    "panda3d-simplepbr>=0.12",
    "pymunk>=6.0",
]

# Integração com o Windows (janela em camadas, click-through, monitoramento).
windows = ["pywin32>=306", "comtypes>=1.4"]

# Bandeja do sistema / menu.
tray = ["pystray>=0.19", "pillow>=11", "PySide6>=6.6"]

# Interação com música: sessão de mídia do Windows + análise de áudio.
music = [
    "winrt-runtime>=4.0",
    "winrt-Windows.Media.Control>=4.0",
]
music-loopback = ["soundcard>=0.4.3"]
music-analysis = ["numpy>=2.0"]

# Desenvolvimento.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
sejoga = "sejoga.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sejoga"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "sejoga/_bundled_assets"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# E402 (import fora do topo) e INTENCIONAL nestes modulos: a ordem de import
# e obrigatoria para o runtime funcionar.
# - window.py: Qt precisa carregar antes do Panda3D (DLLs MSVC conflitantes) e
#   os loadPrcFileData() precisam rodar antes de importar ShowBase/panda3d.
# - build_tentacle_model.py: sys.path.insert antes de importar sejoga.
#
# E701/E702 (multiplos statements por linha) sao o ESTILO DENSO INTENCIONAL dos
# construtores procedurais de geometria/efeitos/audio e das rotinas de preview.
# Separar cada statement nao melhora a legibilidade desse codigo compacto.
[tool.ruff.lint.per-file-ignores]
"src/sejoga/render/window.py" = ["E402"]
"tools/build_tentacle_model.py" = ["E402"]
"src/sejoga/musica/music_speaker.py" = ["E701", "E702"]
"src/sejoga/musica/speaker_effects.py" = ["E701", "E702"]
"src/sejoga/musica/sound_effects.py" = ["E701", "E702"]
"src/sejoga/animacao/lower_body.py" = ["E702"]
"tools/preview_body_actions.py" = ["E701", "E702"]
"tools/smoke_bundle_dances.py" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
warn_unused_ignores = true
ignore_missing_imports = true
