[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sejoga-desktop-companion"
version = "0.1.0"
description = "Companion 3D interativo do mascote Mário (SeJogaNoArmário) para o desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Se Joga no Armário" }]
keywords = ["desktop-companion", "3d", "panda3d", "mascot", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

# Dependências do núcleo: sem engine, sem Win32 — mantêm o pacote importável
# em qualquer máquina (CI, dev, docs).
dependencies = [
    "packaging>=24.0",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Renderizador 3D. A escolha final está documentada em docs/ARQUITETURA.md;
# ambos os grupos ficam disponíveis para permitir a comparação de protótipos.
# pymunk é o motor de física 2D usado por desktop/fisica.py (dependência real de runtime).
panda3d = [
    "panda3d>=1.10.15",
    "panda3d-gltf>=1.3",
    "panda3d-simplepbr>=0.12",
    "pymunk>=6.0",
]

# Integração com o Windows (janela em camadas, click-through, monitoramento).
windows = ["pywin32>=306", "comtypes>=1.4"]

# Bandeja do sistema / menu.
tray = ["pystray>=0.19", "pillow>=11", "PySide6>=6.6"]

# Interação com música: sessão de mídia do Windows + análise de áudio.
music = [
    "winrt-runtime>=4.0",
    "winrt-Windows.Media.Control>=4.0",
]
music-loopback = ["soundcard>=0.4.3"]
music-analysis = ["numpy>=2.0"]

# Desenvolvimento.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.11",
]

[project.scripts]
sejoga = "sejoga.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sejoga"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "sejoga/_bundled_assets"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
  "N", "D", "C901", "PLR0915", "PLR1702",
]
# N802/N816: nomes camelCase exigidos por Panda3D/Qt/Win32 (userExit, nextEntry).
ignore = ["E501", "N802", "N816"]
# PLR1702 so existe como regra em preview; explicit-preview-rules impede que o
# preview ligue outras regras fora do escopo da convencao.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 27
max-nested-blocks = 3

# E402 (import fora do topo) e INTENCIONAL em window.py: Qt precisa carregar antes
# do Panda3D (DLLs MSVC conflitantes) e os loadPrcFileData() precisam rodar antes
# de importar ShowBase/panda3d.
# Testes: o nome da funcao ja descreve o cenario; docstring por teste nao agrega.
[tool.ruff.lint.per-file-ignores]
"src/sejoga/render/window.py" = ["E402"]
"tests/**" = ["D102", "D103", "D107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
warn_unused_ignores = true
ignore_missing_imports = true
